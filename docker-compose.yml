version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: manufact_ai_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: manufact_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manufact_ai_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/manufact_db
    depends_on:
      - db
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  pgdata:
